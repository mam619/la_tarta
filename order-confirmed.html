<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Order confirmed - La Tarta</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800;900&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{--amarelo:#FEEDA7; --castanho:#6E3A1F; --azul:#C4D6DF; --creme:#FFF6D4; --muted:#6F4429;}
  *{box-sizing:border-box;}
  body{margin:0; background:var(--amarelo); color:var(--castanho); font-family:'Inter',Arial,sans-serif; line-height:1.6; -webkit-font-smoothing:antialiased;}
  h1{font-family:'Archivo',Arial,sans-serif; margin:0; line-height:1.1;}
  a{color:inherit;}
  :focus-visible{outline:2px solid var(--castanho); outline-offset:3px;}
  [hidden]{display:none !important;}
  .bar{background:var(--castanho); color:var(--amarelo); display:flex; align-items:center; justify-content:space-between; padding:12px clamp(20px,4vw,48px);}
  .brand{display:flex; align-items:center; gap:12px; text-decoration:none;}
  .brand svg{width:46px; height:46px; display:block;}
  .brand span{font-family:'Archivo',Arial,sans-serif; font-weight:800; font-size:1.3rem; letter-spacing:0.3px;}
  .bar a.back{text-decoration:none; font-weight:500; font-size:0.95rem; border-bottom:1px solid var(--amarelo); padding-bottom:2px;}
  .page{max-width:1000px; margin:0 auto; padding:clamp(48px,8vw,96px) clamp(20px,4vw,48px);
    display:grid; grid-template-columns:minmax(0,1.3fr) minmax(0,1fr); gap:clamp(32px,6vw,72px); align-items:start;}
  @media (max-width:820px){ .page{grid-template-columns:1fr; gap:28px;} .photo{order:-1; aspect-ratio:16 / 10;} }
  h1{font-weight:900; font-size:clamp(2.1rem,3.5vw + 1rem,3.2rem);}
  .lead{color:var(--muted); font-size:1.1rem; margin:14px 0 0;}
  .ticket{margin-top:32px;}
  .when{background:var(--castanho); color:var(--amarelo); padding:20px 22px; font-family:'Archivo',Arial,sans-serif; font-weight:900; font-size:clamp(1.35rem,1.6vw + 0.9rem,1.8rem); line-height:1.25; white-space:pre-line;}
  dl{margin:0; padding:18px 22px; display:grid; grid-template-columns:auto 1fr; gap:10px 20px; background:var(--creme); border:2px solid var(--castanho); border-top:0;}
  dt{color:var(--muted);}
  dd{margin:0; font-weight:600;}
  .help{margin-top:28px; color:var(--muted);}
  .help a{border-bottom:1px solid var(--castanho); text-decoration:none; color:var(--castanho); font-weight:600;}
  .photo{margin:0; border:2px solid var(--castanho); aspect-ratio:4 / 5; overflow:hidden;}
  .photo img{width:100%; height:100%; object-fit:cover; display:block;}
</style>
</head>
<body>
<header class="bar">
  <a href="/" class="brand" aria-label="La Tarta home">
    <svg viewBox="0 0 1096 1096" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><circle cx="548" cy="548" r="540" fill="#FEEDA7"/><path d="M551 387 L425 684 Q548 736 672 686 Z" fill="#6E3A1F"/></svg>
    <span>La Tarta</span>
  </a>
  <a class="back" href="/">Back to the site</a>
</header>
<main class="page" aria-live="polite">
  <div>
    <h1 id="title">Checking your payment…</h1>
    <p class="lead" id="lead"></p>
    <div class="ticket" id="card" hidden>
      <div class="when" id="when"></div>
      <dl>
        <dt>Pickup at</dt><dd id="address"></dd>
        <dt>Cake</dt><dd id="cakes"></dd>
        <dt>Paid</dt><dd id="total"></dd>
      </dl>
    </div>
    <p class="help">Need to change something? Reply to your confirmation email or message us on <a href="https://wa.me/351931498512">WhatsApp</a>.</p>
  </div>
  <figure class="photo"><img src="cheesecake-hero.jpeg" alt="A slice of La Tarta Basque cheesecake on a pale blue plate"></figure>
</main>
<script>
(async () => {
  const $ = (id) => document.getElementById(id);
  const fmt = (iso) => new Intl.DateTimeFormat('en-GB', { weekday: 'long', day: 'numeric', month: 'long', timeZone: 'UTC' })
    .format(new Date(iso + 'T00:00:00Z'));
  const slot = (h) => `${String(h).padStart(2, '0')}:00–${String(h + 1).padStart(2, '0')}:00`;
  const euros = (c) => '€' + (c / 100).toFixed(2).replace('.00', '');
  const sessionId = new URLSearchParams(location.search).get('session_id');

  const show = (title, lead) => { $('title').textContent = title; $('lead').textContent = lead; };
  const getStatus = async () => {
    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), 9000);
    try {
      const res = await fetch('/api/order-status?session_id=' + encodeURIComponent(sessionId || ''),
        { cache: 'no-store', signal: ctrl.signal });
      const body = await res.json().catch(() => ({}));
      return { ok: res.ok, code: res.status, body };
    } catch {
      return { ok: false, code: 0, body: {} }; // timeout or connection blip: try again
    } finally {
      clearTimeout(timer);
    }
  };

  if (!sessionId) {
    show('We couldn\'t find this order', 'If you were charged, message us on WhatsApp and we\'ll sort it out.');
    return;
  }

  let notFound = 0;
  for (let attempt = 0; attempt < 15; attempt++) {
    const { ok, code, body: o } = await getStatus();
    if (ok && o.status === 'paid') {
      show(`Thank you, ${o.name}. Your order is booked.`, 'We\'ve emailed you the details. See you at pickup.');
      document.body.classList.add('done');
      $('when').textContent = `${fmt(o.date)}\n${slot(o.slot)}`;
      $('cakes').textContent = Object.entries(o.items).filter(([, q]) => q > 0).map(([c, q]) => (q === 1 ? `Size ${c}` : `${q}× Size ${c}`)).join(', ');
      $('total').textContent = euros(o.total);
      $('address').textContent = o.pickupAddress || 'Rua das Fontainhas, Alcântara, Lisboa';
      $('card').hidden = false;
      return;
    }
    if (ok && o.status === 'processing') {
      show('Payment is being confirmed', 'Approve it in your MB WAY app if you haven\'t yet. This page updates by itself.');
    }
    if (code === 404 && ++notFound >= 3) {
      show('We couldn\'t find this order', 'If you were charged, message us on WhatsApp and we\'ll sort it out.');
      return;
    }
    await new Promise((r) => setTimeout(r, 3000));
  }
  show('Payment received', 'We\'re confirming your order and will email you the details in the next few minutes. If nothing arrives within 15 minutes, message us on WhatsApp.');
})();
</script>
</body>
</html>
